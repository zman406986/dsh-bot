# RACOONS overlay for the main checkout.
# Run from the repo root: dsh --profile web --patch dev/cordis.racoons.patch.yml
# The plugin path resolves relative to this patch, so it uses this checkout's build.
#
# Ticket 145: racoons is an OPTIONAL test feature, off by default
# (owner ruling 2026-11-05). This overlay is the manual switch: it turns the
# mount on, pins the test storage root (keeping test ledgers out of
# <DSH_HOME>/storages/racoons) and states the enforcement mode explicitly.
#
# racoonsEnabled: true → mount racoons for this launch only.
# racoonsRecordOnly: false → enforcement "apply" (the owner-ruled default).
# Set it to true to record verdicts without applying any context edit.
# racoonsContextWindowTokens: 0 → half-window auto prune off.
# The relative root is resolved against the process cwd by the plugin, so run
# this patch from the worktree root.
- insert:
    - id: multitask-dispatcher
      name: '../lib/index.js'
      config:
        enabled: true
        racoonsEnabled: true
        racoonsRecordOnly: false
        racoonsStorageRoot: '.scratch/racoons-storage'
        racoonsContextWindowTokens: 0
