# Committed dev overlay for the launcher's web route.
#
#   dsh --profile web --patch dev/cordis.web.patch.yml
#
# Passed explicitly by the desktop launcher (dsh-bot.ps1) in the SAME command
# that spawns dsh, so the overlay a live pass ran is reviewable in the tree
# rather than regenerated in %TEMP% (ticket 43 Requirement 1; ticket 48
# Requirement 2).
#
# `name` is deliberately RELATIVE: the boot layer anchors relative and absolute
# inserted paths beside the patch file itself into file URLs
# (`anchorInsertedPluginNames`, dsh-app-boot/lib/index.js:1170-1177), so
# `../lib/index.js` resolves to the lib/ of whichever checkout passed it. An
# absolute path would hard-code one checkout and silently strand the other.
#
# This is the transient overlay route only. The web profile's package tree and
# its own cordis.patch.yml are never touched, and the dispatcher's shipping
# home stays the dedicated multitask profile — the plugin is always-on with no
# flag or kill switch (ADR-0018, superseding ADR-0005's flag/toggle semantics).
# Per ADR-0021 (2026-09-20) the patched boot serves stock dsh as the primary UI
# and this module is purely additive: a "Dispatchers" launcher chip opens the
# floating dispatcher window. No whole-UI replacement.
- insert:
    - id: multitask-dispatcher
      name: '../lib/index.js'
      config:
        enabled: true
