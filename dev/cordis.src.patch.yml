# Dev overlay that loads the plugin from TypeScript SOURCE, not from lib/.

#   node --import tsx dev/e2e-mock.mjs
#
# `lib/` is a build artifact (git-ignored). The scenario phase (ticket 120)
# must exercise the CURRENT tree, and the harness is not allowed to run a
# build, so it passes this overlay with `node --import tsx` instead of
# dev/cordis.web.patch.yml. The live/desktop launcher keeps using that one.
#
# `name` is deliberately RELATIVE for the same reason as the shipped dev
# overlay: the boot layer anchors relative inserted paths beside the patch
# file itself, so `../src/index.ts` resolves to whichever checkout passed it.
- insert:
    - id: multitask-dispatcher
      name: '../src/index.ts'
      config:
        enabled: true
